<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catastro Rural y Productivo - Comuna</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=3.6">
</head>
<body>

    <div id="contenedor-logo-mapa" class="no-imprimir">
        <img src="logo.png" alt="Logo Institucional" id="logo-mapa">
    </div>

    <div id="panel-busqueda-lateral" class="no-imprimir">
        <div id="contenedor-busqueda">
            <input type="text" id="input-busqueda" list="coincidencias" placeholder="Partida, TGI o Titular..." oninput="actualizarCoincidencias()">
            <datalist id="coincidencias"></datalist>
            <button id="btn-buscar" onclick="ejecutarBusqueda()">🔍</button>
        </div>

        <div id="contenedor-coordenadas">
            <input type="text" id="input-coordenadas" placeholder="Ej: -34.15, -62.6...">
            <button id="btn-ir-coordenadas" onclick="buscarPorCoordenadas()">📍 Ir</button>
        </div>
    </div>

    <div class="botones-controles-derechos no-imprimir">
        <button id="btn-reset" onclick="volverAlMapa()">⬅ Volver a Vista General</button>
        <button id="btn-referencias" onclick="toggleReferencias()">📍 Mostrar Referencias</button>
        <button id="btn-cosecha" onclick="mostrarReporteCosecha()">🌾 Índice Cosecha 2026</button>
        <button id="btn-reporte" onclick="mostrarTopDeudores()">📊 Top 50 Mayores Deudas</button>
    </div>

    <div id="map" class="no-imprimir"></div>

    <div id="pantalla-reporte" style="display: none;">
        <div class="encabezado-reporte no-imprimir">
            <div class="titulo-web-reporte">
                <img src="logo.png" alt="Logo" class="logo-reporte-chico">
                <h2 id="titulo-dinamico-reporte">Reporte Oficial</h2>
            </div>
            <div class="acciones-reporte">
                <button class="btn-print" onclick="window.print()">🖨 Imprimir Reporte</button>
                <button class="btn-back" onclick="cerrarReporte()">⬅ Volver al Mapa</button>
            </div>
        </div>
        
        <div class="titulo-impresion-visible">
            <div class="membrete-impresion">
                <img src="logo.png" alt="Logo Institucional" class="logo-membrete">
                <div class="datos-municipio">
                    <h1>SISTEMA DE GESTIÓN RURAL</h1>
                    <p>Área de Rentas y Producción Agrícola de la Comuna</p>
                </div>
            </div>
            <hr>
            <h2 id="subtitulo-dinamico-impresion">REPORTE GENERAL</h2>
            <p id="descripcion-dinamica-impresion">Información extraída del módulo de catastro.</p>
        </div>

        <table class="tabla-reporte">
            <thead id="cabecera-tabla-reporte">
                </thead>
            <tbody id="cuerpo-tabla-reporte">
                </tbody>
        </table>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js?v=3.6"></script>
</body>
</html>
