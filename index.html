<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />    <title>Auditoría Catastral Rural</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=1.7" />
</head>
<body>

    <div id="menu-controles">
        <div class="cabecera-menu-movil">
            <div id="contenedor-busqueda">
                <input type="text" id="input-busqueda" list="coincidencias" placeholder="Partida, TGI o Titular..." oninput="actualizarCoincidencias()">
                <datalist id="coincidencias"></datalist>
                <button id="btn-buscar" onclick="ejecutarBusqueda()">🔍</button>
            </div>
            
            <button id="btn-hamburguesa" onclick="toggleMenuMovil()">☰</button>
        </div>

        <div id="controles-colapsables" class="controles-links">
            <div class="grupo-coordenadas">
                <input type="text" id="input-coordenadas" placeholder="Lat, Lng o DMS...">
                <button onclick="buscarPorCoordenadas()">📍 Ir</button>
            </div>
            <button id="btn-grafico" onclick="toggleGraficoSemaforo()">📊 Semáforo</button>
            <button id="btn-top-deudores" onclick="toggleTopDeudores()">🏆 Top Deudores</button>
            <button id="btn-caminos" onclick="togglePanelCaminos()">🛣️ Caminos</button>
            <button id="btn-referencias" onclick="toggleReferencias()">📍 Referencias</button>
            <button id="btn-satelital" onclick="toggleImagenSatelital()">🛰️ Satelital</button>
            <button id="btn-reset" style="display:none;" onclick="volverAlMapa()">🔄 Volver</button>
        </div>
    </div>

    <div id="map"></div>

    <!-- PANEL DESPLEGABLE DE CAMINOS RURALES -->
    <div id="panel-caminos-rurales" class="panel-lateral" style="display:none; top: 75px; right: 15px; left: auto; width: 320px;">
        <div class="cabecera-panel">
            <h3>🛣️️ Caminos Rurales</h3>
            <span class="btn-cerrar" onclick="togglePanelCaminos()">&times;</span>
        </div>
        <div style="padding: 14px;">
            <label style="font-size: 11px; font-weight: 700; color: #475569; display: block; margin-bottom: 6px;">SELECCIONAR CAMINO:</label>
            <select id="select-camino-rural" class="select-camino" onchange="seleccionarCaminoExacto(this.value)">
                <option value="">-- Cargar Caminos --</option>
            </select>

            <div id="info-camino-detalle" style="margin-top: 12px; display: none;">
                <div style="background-color: #f1f5f9; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; margin-bottom: 10px;">
                    <div id="lbl-nombre-camino" style="font-weight: 700; color: #0f172a; font-size: 13px;"></div>
                    <div id="lbl-longitud-camino" style="font-size: 11px; color: #0284c7; font-weight: 600; margin-top: 2px;"></div>
                </div>

                <!-- SEMÁFORO DE DEUDA DEL CAMINO SELECCIONADO -->
                <div id="contenedor-semaforo-camino"></div>

                <button onclick="limpiarSeleccionCamino()" style="width:100%; margin-top:10px; height:32px; background-color:#64748b; color:white; border:none; border-radius:6px; font-weight:600; cursor:pointer; font-size:12px;">❌ Limpiar Selección</button>
            </div>
        </div>
    </div>

    <div id="panel-datos-parcela" class="panel-lateral" style="display:none;">
        <div class="cabecera-panel">
            <h3>Detalle de Parcela</h3>
            <span class="btn-cerrar" onclick="cerrarPanelDatos()">&times;</span>
        </div>
        <div id="contenido-tabla-datos"></div>
    </div>

    <div id="modal-grafico-barras" class="modal-grafico" style="display:none;">
        <div id="contenedor-barras-dinamicas"></div>
    </div>

    <div id="pantalla-completa-top" class="vista-completa" style="display:none;">
        <div class="cabecera-reporte">
            <h2>Grandes Deudores: Cuentas con Mayor Deuda Fiscal Acumulada</h2>
            <div style="display: flex; gap: 10px;">
                <button class="btn-imprimir-reporte" onclick="window.print()">🖨️ Imprimir / PDF</button>
                <button class="btn-cerrar-pantalla" onclick="toggleTopDeudores()">❌ Cerrar Reporte</button>
            </div>
        </div>
        <div id="contenedor-tabla-grande-top"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
