<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catastro Rural - Módulo de Auditoría</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=12.0">
</head>
<body>

    <div id="contenedor-logo-mapa" class="no-imprimir">
        <img src="logo.png" alt="Logo Institucional" id="logo-mapa">
    </div>

    <div id="panel-busqueda-lateral" class="no-imprimir">
        <div id="contenedor-busqueda">
            <input type="text" id="input-busqueda" list="coincidencias" placeholder="Partida, TGI o Titular..." oninput="actualizarCoincidencias()">
            <datalist id="coincidencias"></datalist>
            <button id="btn-buscar" onclick="ejecutarBusqueda()">🔍</button>
        </div>

        <div id="contenedor-coordenadas">
            <input type="text" id="input-coordenadas" placeholder="Ej: -34.15, -62.6...">
            <button id="btn-ir-coordenadas" onclick="buscarPorCoordenadas()">📍 Ir</button>
        </div>

        <div id="panel-datos-parcela" style="display: none;">
            <div class="encabezado-panel-datos">
                <h3>📋 Ficha Parcela</h3>
                <button class="btn-cerrar-panel" onclick="cerrarPanelDatos()">×</button>
            </div>
            <div id="contenido-tabla-datos">
                </div>
        </div>
    </div>

    <div class="botones-controles-derechos no-imprimir">
        <button id="btn-reset" onclick="volverAlMapa()">⬅ Volver a Vista General</button>
        <button id="btn-referencias" onclick="toggleReferencias()">📍 Mostrar Referencias</button>
        <button id="btn-grafico" onclick="toggleGraficoSemaforo()">📊 Gráfico Semáforo</button>
        <button id="btn-top-deudores" onclick="toggleTopDeudores()">🔥 Top 50 Deudores</button>
    </div>

    <div id="modal-grafico-barras" class="no-imprimir" style="display: none;">
        <div class="encabezado-grafico">
            <h4>📊 Semáforo Fiscal</h4>
            <button class="btn-cerrar-grafico" onclick="toggleGraficoSemaforo()">×</button>
        </div>
        <div id="contenedor-barras-dinamicas" class="cuerpo-grafico">
            </div>
    </div>

    <div id="pantalla-completa-top" style="display: none;">
        <div class="encabezado-informe-pantalla no-imprimir">
            <h2>🔥 Reporte de Auditoría: Top 50 Mayores Deudores Unificados por TGI</h2>
            <div class="acciones-informe">
                <button class="btn-accion-print" onclick="window.print()">🖨️ Imprimir Reporte</button>
                <button class="btn-accion-cerrar" onclick="toggleTopDeudores()">❌ Cerrar Vista</button>
            </div>
        </div>
        
        <div class="encabezado-impresion-formal">
            <img src="logo.png" alt="Logo">
            <div>
                <h2>INFORME DE MOROSIDAD Y AUDITORÍA FISCAL RURAL</h2>
                <p>Ranking Consolidador - 50 Mayores Cuentas de TGI con Deuda Activa Unificada</p>
            </div>
        </div>

        <div id="contenedor-tabla-grande-top">
            </div>
    </div>

    <div id="map" class="no-imprimir"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js?v=12.0"></script>
</body>
</html>
