<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catastro Rural Interactivo</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="contenedor-busqueda" class="no-imprimir">
        <input type="text" id="input-busqueda" list="coincidencias" placeholder="Buscar por Partida, TGI o Titular..." oninput="actualizarCoincidencias()">
        <datalist id="coincidencias"></datalist>
        <button id="btn-buscar" onclick="ejecutarBusqueda()">🔍</button>
    </div>

    <button id="btn-reset" class="no-imprimir" onclick="volverAlMapa()">⬅ Volver a Vista de Zonas</button>
    <button id="btn-reporte" class="no-imprimir" onclick="mostrarTopDeudores()">📊 Top 50 Deudores</button>

    <div id="map" class="no-imprimir"></div>

    <div id="pantalla-reporte" style="display: none;">
        <div class="encabezado-reporte no-imprimir">
            <h2>Ranking - Top 50 Mayores Deudores Rurales</h2>
            <div class="acciones-reporte">
                <button class="btn-print" onclick="window.print()">🖨 Imprimir Reporte</button>
                <button class="btn-back" onclick="cerrarReporte()">⬅ Volver al Mapa</button>
            </div>
        </div>
        
        <div class="titulo-impresion-visible">
            <h2>REPORTE GENERAL DE MOROSIDAD RURAL</h2>
            <p>Listado de los 50 contribuyentes con mayor cantidad de períodos adeudados.</p>
        </div>

        <table class="tabla-reporte">
            <thead>
                <tr>
                    <th>#</th>
                    <th>TGI Rural</th>
                    <th>Titular</th>
                    <th>Períodos Debidos</th>
                    <th>Total Adeudado</th>
                </tr>
            </thead>
            <tbody id="cuerpo-tabla-reporte">
                </tbody>
        </table>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
