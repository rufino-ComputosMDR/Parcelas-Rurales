<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría Catastral Rural</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=1.1" />
</head>
<body>

    <div id="menu-controles">
        <div class="cabecera-menu-movil">
            <div id="contenedor-busqueda">
                <input type="text" id="input-busqueda" list="coincidencias" placeholder="Partida, TGI o Titular..." oninput="actualizarCoincidencias()">
                <datalist id="coincidencias"></datalist>
                <button id="btn-buscar" onclick="ejecutarBusqueda()">🔍</button>
            </div>
            
            <button id="btn-hamburguesa" onclick="toggleMenuMovil()">☰</button>
        </div>

        <div id="controles-colapsables" class="controles-links">
            <div class="grupo-coordenadas">
                <input type="text" id="input-coordenadas" placeholder="Lat, Lng o DMS...">
                <button onclick="buscarPorCoordenadas()">📍 Ir</button>
            </div>
            <button id="btn-grafico" onclick="toggleGraficoSemaforo()">📊 Semáforo</button>
            <button id="btn-top-deudores" onclick="toggleTopDeudores()">🏆 Top Deudores</button>
            <button id="btn-referencias" onclick="toggleReferencias()">📍 Referencias</button>
            <button id="btn-reset" style="display:none;" onclick="volverAlMapa()">🔄 Volver</button>
        </div>
    </div>

    <div id="map"></div>

    <div id="panel-datos-parcela" class="panel-lateral" style="display:none;">
        <div class="cabecera-panel">
            <h3>Detalle de Parcela</h3>
            <span class="btn-cerrar" onclick="cerrarPanelDatos()">&times;</span>
        </div>
        <div id="contenido-tabla-datos"></div>
    </div>

    <div id="modal-grafico-barras" class="modal-grafico" style="display:none;">
        <div id="contenedor-barras-dinamicas"></div>
    </div>

    <div id="pantalla-completa-top" class="vista-completa" style="display:none;">
        <div class="cabecera-reporte">
            <h2>Grandes Deudores: Cuentas con Mayor Deuda Fiscal Acumulada</h2>
            <button class="btn-cerrar-pantalla" onclick="toggleTopDeudores()">❌ Cerrar Reporte</button>
        </div>
        <div id="contenedor-tabla-grande-top"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
